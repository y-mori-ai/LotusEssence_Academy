<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>お申し込みありがとうございます｜LEA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="logo_2.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #fdf3f5;
      --bg-soft:   #fae8ee;
      --ink:       #2d1820;
      --ink-soft:  #5a3a48;
      --muted:     #8a6878;
      --border:    #f0d8e0;
      --rose:      #c98899;
      --rose-dark: #8e5567;
      --gold:      #c4a47a;
      --font-display: 'Cormorant Garamond', serif;
      --font-body:    'Noto Sans JP', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      color: var(--ink);
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 56px 48px;
      max-width: 560px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 32px rgba(45,24,32,0.06);
    }
    .logo { height: 32px; width: auto; margin: 0 auto 36px; display: block; }
    .divider {
      width: 40px; height: 1px;
      background: var(--rose);
      margin: 0 auto 28px;
    }
    .title {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 400;
      letter-spacing: 0.06em;
      color: var(--ink);
      margin-bottom: 16px;
    }
    .subtitle {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.08em;
      margin-bottom: 32px;
    }
    .message {
      font-size: 14px;
      line-height: 2;
      color: var(--ink-soft);
      margin-bottom: 40px;
    }
    .message strong { color: var(--ink); }
    .notice {
      background: rgba(196,164,122,0.1);
      border-left: 3px solid var(--gold);
      border-radius: 4px;
      padding: 16px 20px;
      text-align: left;
      font-size: 13px;
      line-height: 1.9;
      color: var(--ink-soft);
      margin-bottom: 36px;
    }
    .notice strong { color: var(--ink); }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #1877F2;
      color: #fff;
      border-radius: 999px;
      padding: 16px 36px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-decoration: none;
      transition: opacity 0.2s;
      width: 100%;
    }
    .btn:hover { opacity: 0.88; }
    .btn svg { width: 20px; height: 20px; flex-shrink: 0; }
    .footer-note {
      margin-top: 28px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.8;
    }
    .back-link {
      display: inline-block;
      margin-top: 32px;
      font-size: 12px;
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    @media (max-width: 600px) {
      .card { padding: 40px 24px; }
      .title { font-size: 24px; }
    }
  </style>
</head>
<body>

<div class="card">
  <img src="logo_1.png" alt="LEA" class="logo">
  <div class="divider"></div>

  <p class="subtitle">Thank you</p>
  <h1 class="title">お申し込みありがとうございます</h1>

  <p class="message">
    LEAへのご入会、心より歓迎します。<br>
    決済が完了しましたので、次のステップに進みましょう。
  </p>

  <div class="notice">
    <strong>次のステップ：Facebookグループに参加してください</strong><br>
    月1回のZoom配信・アーカイブ・質問ボックスなど、LEAのすべてのコンテンツは<strong>非公開Facebookグループ</strong>内でご提供します。<br>
    下のボタンからグループに参加申請をお願いします。
  </div>

  <a class="btn" href="https://www.facebook.com/groups/909224352108966/" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.792-4.697 4.533-4.697 1.312 0 2.686.235 2.686.235v2.97h-1.513c-1.491 0-1.956.93-1.956 1.874v2.25h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/></svg>
    Facebookグループに参加する
  </a>

  <p class="footer-note">
    参加申請後、運営側で承認します。<br>
    承認までしばらくお待ちください。
  </p>

  <a href="index.html" class="back-link">LEAトップページに戻る</a>
</div>

</body>
</html>
